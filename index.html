const fmt=n=>n.toLocaleString('ko-KR')+'원';
const cart=new Map();
const $=id=>document.getElementById(id);
let toastTimeout;
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2800)}
function openDialog(id){const el=$(id);if(!el.open)el.showModal()}
function updateCount(){let n=0;for(const qty of cart.values())n+=qty;$('cartCount').textContent=String(n)}
function addCart(id){cart.set(id,Math.min(99,(cart.get(id)||0)+1));updateCount();toast('장바구니에 담았습니다.');if($('cartDialog').open)renderCart()}
function showDetail(id){const p=productData.find(x=>x.id===id);if(!p)return;$('detailTitle').textContent=p.name;const c=$('detailContent');c.replaceChildren();const img=document.createElement('img');img.src=p.image;img.alt=p.name+' 제품 이미지';const info=document.createElement('div');info.className='detailText';const label=document.createElement('p');label.className='eyebrow';label.textContent=p.id+' · YEORUA';const title=document.createElement('h3');title.textContent=p.name;const desc=document.createElement('p');desc.textContent=p.description;const price=document.createElement('div');price.className='price';price.textContent=fmt(p.price);const button=document.createElement('button');button.className='btn';button.textContent='장바구니 담기';button.addEventListener('click',()=>addCart(p.id));info.append(label,title,desc,price,button);c.append(img,info);openDialog('detailDialog')}
function renderProducts(){const grid=$('productsGrid');productData.forEach(p=>{const card=document.createElement('article');card.className='product';const photo=document.createElement('button');photo.type='button';photo.className='productFigure';photo.setAttribute('aria-label',p.name+' 상세 보기');photo.addEventListener('click',()=>showDetail(p.id));const img=document.createElement('img');img.src=p.image;img.alt='YEORUA '+p.name+' 단독 제품 사진';img.loading='lazy';photo.append(img);const sku=document.createElement('p');sku.className='sku';sku.textContent=p.id;const name=document.createElement('h3');name.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=fmt(p.price);const add=document.createElement('button');add.type='button';add.className='add';add.textContent='장바구니 담기 +';add.addEventListener('click',()=>addCart(p.id));card.append(photo,sku,name,price,add);grid.append(card)})}
function cartTotal(){return productData.reduce((s,p)=>s+p.price*(cart.get(p.id)||0),0)}
function renderCart(){const root=$('cartContent');root.replaceChildren();if(cart.size===0){const empty=document.createElement('div');empty.className='empty';empty.textContent='장바구니가 비어 있습니다. 마음에 드는 제품을 담아보세요.';root.append(empty);return}productData.filter(p=>cart.has(p.id)).forEach(p=>{const row=document.createElement('div');row.className='cartItem';const image=document.createElement('img');image.src=p.image;image.alt=p.name+' 제품';const main=document.createElement('div');const name=document.createElement('h3');name.textContent=p.name;const price=document.createElement('span');price.className='price';price.textContent=fmt(p.price*(cart.get(p.id)||0));main.append(name,price);const actions=document.createElement('div');actions.className='actions';const qty=document.createElement('div');qty.className='qty';const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label',p.name+' 수량 줄이기');minus.addEventListener('click',()=>changeQty(p.id,-1));const count=document.createElement('span');count.textContent=cart.get(p.id);const plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label',p.name+' 수량 늘리기');plus.addEventListener('click',()=>changeQty(p.id,1));qty.append(minus,count,plus);const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='삭제';remove.addEventListener('click',()=>{cart.delete(p.id);updateCount();renderCart()});actions.append(qty,remove);row.append(image,main,actions);root.append(row)});const total=document.createElement('div');total.className='cartTotal';const label=document.createElement('span');label.textContent='상품 합계';const amount=document.createElement('span');amount.textContent=fmt(cartTotal());total.append(label,amount);const checkout=document.createElement('button');checkout.className='btn';checkout.style.width='100%';checkout.textContent='가상 주문서 작성';checkout.addEventListener('click',()=>{$('cartDialog').close();openCheckout()});root.append(total,checkout)}
function changeQty(id,delta){const next=(cart.get(id)||0)+delta;if(next<=0)cart.delete(id);else cart.set(id,Math.min(99,next));updateCount();renderCart()}
function openCheckout(){if(!cart.size){toast('장바구니에 제품을 먼저 담아주세요.');return}$('checkoutSummary').textContent='주문 상품 '+[...cart.values()].reduce((a,b)=>a+b,0)+'개 · 합계 '+fmt(cartTotal());$('checkoutError').textContent='';openDialog('checkoutDialog')}
$('checkoutForm').addEventListener('submit',e=>{e.preventDefault();const n=$('buyerName').value.trim(),p=$('buyerPhone').value.trim(),a=$('buyerAddress').value.trim();if(!n||!p||!a){$('checkoutError').textContent='이름, 전화번호, 주소를 모두 입력해 주세요.';return}cart.clear();updateCount();$('checkoutForm').reset();$('checkoutError').textContent='';$('checkoutDialog').close();toast('데모 주문 완료! 실제 결제나 배송은 진행되지 않습니다.')});
$('cartBtn').addEventListener('click',()=>{renderCart();openDialog('cartDialog')});$('ordersBtn').addEventListener('click',()=>toast('주문내역은 Supabase 연결 예정입니다.'));document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>$(btn.dataset.close).close()));document.querySelectorAll('[data-notice]').forEach(btn=>btn.addEventListener('click',()=>toast(btn.dataset.notice)));document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));$('hambBtn').addEventListener('click',()=>{let on=$('mobileNav').classList.toggle('open');$('hambBtn').setAttribute('aria-expanded',String(on))});// In an iframe srcdoc page, ordinary #hash links may resolve against the parent file URL.
// Prevent iframe navigation completely and scroll within this document only.
document.addEventListener('click',event=>{
  const link=event.target.closest('a[href^="#"]');
  if(!link)return;
  const targetId=link.getAttribute('href').slice(1);
  const target=document.getElementById(targetId);
  if(!target)return;
  event.preventDefault();
  target.scrollIntoView({behavior:'smooth',block:'start'});
  $('mobileNav').classList.remove('open');
  $('hambBtn').setAttribute('aria-expanded','false');
});
renderProducts();
</script></body></html></template>
<script>
const shell=document.getElementById('previewShell');const frame=document.getElementById('previewFrame');
frame.srcdoc=document.getElementById('siteTemplate').innerHTML;
document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{shell.className='device-shell '+button.dataset.device;document.querySelectorAll('[data-device]').forEach(el=>{const active=el===button;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))})}));
</script></body></html>
